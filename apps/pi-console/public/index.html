<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pi Console · tango</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside>
    <div class="brand"><span>π</span><div><strong>Pi Console</strong><small>tango · tailnet</small></div></div>
    <button id="new-thread" class="primary">＋ New thread</button>
    <nav id="threads"></nav>
    <footer><span class="dot"></span> Private Tailscale service</footer>
  </aside>
  <main>
    <header>
      <button id="menu" aria-label="Toggle threads">☰</button>
      <div><h1 id="title">Pi Console</h1><p id="target">Select or create a thread</p></div>
      <button id="delete" class="icon" title="Delete thread">⌫</button>
    </header>
    <section id="empty"><div class="hero">π</div><h2>Your NixOS command center</h2><p>Build, diagnose, and deploy across the tailnet with persistent Pi sessions.</p></section>
    <section id="messages"></section>
    <div id="activity"></div>
    <form id="composer">
      <textarea id="prompt" rows="1" placeholder="Message Pi…" disabled></textarea>
      <button id="stop" type="button" title="Stop" hidden>■</button>
      <button id="send" type="submit" disabled>↑</button>
    </form>
  </main>
  <dialog id="create-dialog">
    <form method="dialog" id="create-form">
      <h2>New command thread</h2>
      <label>Title<input id="new-title" maxlength="100" placeholder="Upgrade the fleet"></label>
      <label>Target<select id="new-target"></select></label>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button class="primary" value="default">Create</button></div>
    </form>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
