apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: kilo
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:10.10.7
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: jukebox
              mountPath: /Jukebox
              readOnly: true
            - name: movies
              mountPath: /Movies
              readOnly: true
            - name: tv
              mountPath: /TV
              readOnly: true
            - name: sports
              mountPath: /Sports
              readOnly: true
            - name: dri
              mountPath: /dev/dri
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir: {}
        - name: jukebox
          hostPath:
            path: /mnt/illmatic/Jukebox
            type: Directory
        - name: movies
          hostPath:
            path: /mnt/illmatic/Movies
            type: Directory
        - name: tv
          hostPath:
            path: /mnt/illmatic/TV
            type: Directory
        - name: sports
          hostPath:
            path: /mnt/illmatic/Sports
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: kilo
      containers:
        - name: navidrome
          image: docker.io/deluan/navidrome:0.55.2
          env:
            - name: ND_MUSICFOLDER
              value: /Jukebox
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: "false"
          ports:
            - name: http
              containerPort: 4533
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /Jukebox
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          hostPath:
            path: /mnt/illmatic/Jukebox
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: http
---
apiVersion: v1
kind: Namespace
metadata:
  name: network
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-data
  namespace: network
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      nodeSelector:
        kubernetes.io/hostname: kilo
      containers:
        - name: pihole
          image: docker.io/pihole/pihole:2025.06.2
          env:
            - name: TZ
              value: America/New_York
            - name: FTLCONF_dns_listeningMode
              value: all
            # Create network/pihole-admin before first use to enable login.
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password
                  optional: true
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pihole-data
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: network
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
